<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12131a">
<title>Søg videre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12131a;
    --panel:#1b1d28;
    --panel-edge:#2b2e3d;
    --tile:#20222f;
    --tile-edge:#31344a;
    --tile-hover:#282b3c;
    --ink:#f4f5fb;
    --muted:#9aa0b8;
    --focus:#8ab4ff;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:'Space Grotesk',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(120% 90% at 50% -10%, #1a1c28 0%, var(--bg) 60%);
    color:var(--ink);
    font-family:var(--sans);
    min-height:100dvh;
    padding:
      calc(env(safe-area-inset-top) + 18px)
      calc(env(safe-area-inset-right) + 16px)
      calc(env(safe-area-inset-bottom) + 28px)
      calc(env(safe-area-inset-left) + 16px);
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:560px;margin:0 auto}

  /* Header / query echo — the reason the page exists */
  .eyebrow{
    font-size:12px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);font-weight:600;margin:2px 2px 10px;
  }
  .query{
    display:flex;align-items:center;gap:10px;
    background:var(--panel);
    border:1px solid var(--panel-edge);
    border-radius:16px;
    padding:14px 14px;
    box-shadow:0 8px 30px rgba(0,0,0,.35);
  }
  .query .caret{
    font-family:var(--mono);color:var(--focus);font-size:18px;
    line-height:1;flex:0 0 auto;user-select:none;
  }
  #q{
    flex:1 1 auto;min-width:0;
    background:transparent;border:0;outline:0;
    color:var(--ink);
    font-family:var(--mono);font-size:18px;font-weight:500;
    padding:2px 0;
  }
  #q::placeholder{color:#5b6180}
  .clear{
    flex:0 0 auto;
    width:30px;height:30px;border-radius:9px;
    border:1px solid var(--tile-edge);
    background:var(--tile);color:var(--muted);
    font-size:16px;line-height:1;cursor:pointer;
    display:grid;place-items:center;
  }
  .clear:active{background:var(--tile-hover)}

  .hint{
    color:var(--muted);font-size:12.5px;margin:12px 4px 18px;line-height:1.5;
  }

  /* Category columns: every category is its own side-by-side column */
  #groups{
    display:grid;
    grid-template-columns:repeat(4, minmax(0, 1fr));
    gap:10px;
    align-items:start;
  }
  .group{
    display:flex;
    flex-direction:column;
    gap:10px;
    min-width:0;
  }

  .tile{
    display:flex;flex-direction:column;gap:8px;
    align-items:flex-start;text-align:left;
    background:var(--tile);
    border:1px solid var(--tile-edge);
    border-radius:14px;
    padding:12px 10px 11px;
    color:var(--ink);
    cursor:pointer;
    transition:transform .08s ease, background .12s ease, border-color .12s ease;
  }
  .tile:hover{background:var(--tile-hover)}
  .tile:active{transform:scale(.97)}
  .tile:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

  /* Logo chip — real service logo on a light plate so any logo stays visible */
  .badge{
    width:36px;height:36px;border-radius:10px;
    display:grid;place-items:center;
    background:#fff;
    border:1px solid rgba(0,0,0,.10);
    overflow:hidden;
  }
  .badge img{width:22px;height:22px;display:block;object-fit:contain}
  .name{font-weight:600;font-size:14px;letter-spacing:.01em;line-height:1.2}
  .sub{font-size:11px;color:var(--muted);margin-top:-2px}

  .foot{
    margin-top:22px;color:var(--muted);font-size:11.5px;
    line-height:1.5;text-align:center;
  }

  @media(prefers-reduced-motion:reduce){
    .tile{transition:none}
    .tile:active{transform:none}
  }
</style>
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">Søg videre</p>

    <div class="query">
      <span class="caret" aria-hidden="true">&gt;</span>
      <input id="q" type="text" placeholder="skriv eller markér tekst…"
             autocomplete="off" autocapitalize="none" spellcheck="false"
             enterkeyhint="search" aria-label="Søgetekst">
      <button class="clear" id="clear" type="button" aria-label="Ryd tekst">✕</button>
    </div>

    <p class="hint">Vælg en tjeneste — den åbner søgningen med teksten ovenfor.
    Retter du teksten, søger knapperne på det nye.</p>

    <div id="groups"></div>

    <p class="foot">Tjenester med app åbner i appen, hvis “Åbn understøttede links” er slået til.</p>
  </main>

<script>
  // Services grouped by type (no titles — the clusters carry the grouping).
  // domain = where the real logo (favicon) is fetched from.
  // mono   = short fallback shown only if a logo fails to load.
  // %s in url is replaced by the URL-encoded search text.
  const GROUPS = [
    [ // søgning & opslag
      { name:"Google",         sub:"web",         domain:"google.com",        mono:"G",   url:"https://www.google.com/search?q=%s" },
      { name:"Google Billeder",sub:"billeder",    domain:"images.google.com", mono:"IMG", url:"https://www.google.com/search?tbm=isch&q=%s" },
      { name:"Wikipedia",      sub:"leksikon",    domain:"da.wikipedia.org",  mono:"W",   url:"https://da.wikipedia.org/w/index.php?search=%s" },
      { name:"Google Maps",    sub:"kort",        domain:"maps.google.com",   mono:"M",   url:"https://www.google.com/maps/search/?api=1&query=%s" },
    ],
    [ // film, tv & medier
      { name:"YouTube",        sub:"video",       domain:"youtube.com",       mono:"YT",  url:"https://www.youtube.com/results?search_query=%s" },
      { name:"IMDb",           sub:"film & tv",   domain:"imdb.com",          mono:"IMDb",url:"https://www.imdb.com/find/?q=%s" },
      { name:"DR TV",          sub:"drtv",        domain:"dr.dk",             mono:"DR",  url:"https://www.dr.dk/drtv/soeg?q=%s" },
      { name:"Netflix",        sub:"stream",      domain:"netflix.com",       mono:"N",   url:"https://www.netflix.com/search?q=%s" },
      { name:"HBO Max",        sub:"stream",      domain:"hbomax.com",        mono:"HBO", url:"https://www.hbomax.com/search?q=%s" },
      { name:"Disney+",        sub:"stream",      domain:"disneyplus.com",    mono:"D+",  url:"https://www.disneyplus.com/search?q=%s" },
      { name:"Spotify",        sub:"musik",       domain:"spotify.com",       mono:"S",   url:"https://open.spotify.com/search/%s" },
    ],
    [ // socialt
      { name:"Reddit",         sub:"tråde",       domain:"reddit.com",        mono:"r/",  url:"https://www.reddit.com/search/?q=%s" },
      { name:"Instagram",      sub:"foto & reels",domain:"instagram.com",     mono:"IG",  url:"https://www.instagram.com/explore/search/keyword/?q=%s" },
      { name:"Facebook",       sub:"socialt",     domain:"facebook.com",      mono:"f",   url:"https://www.facebook.com/search/top/?q=%s" },
    ],
    [ // AI
      { name:"ChatGPT",        sub:"AI-prompt",   domain:"chatgpt.com",       mono:"GPT", url:"https://chatgpt.com/?q=%s" },
      { name:"Claude",         sub:"AI-prompt",   domain:"claude.ai",         mono:"C",   url:"https://claude.ai/new?q=%s" },
    ],
  ];

  const input = document.getElementById('q');
  const groupsEl = document.getElementById('groups');
  const clearBtn = document.getElementById('clear');

  // Prefill from ?q= (this is where the text-selection app drops the selected text).
  const initial = new URLSearchParams(location.search).get('q') || '';
  input.value = initial;

  // Build grouped tiles
  for (const group of GROUPS){
    const g = document.createElement('div');
    g.className = 'group';

    for (const s of group){
      const b = document.createElement('button');
      b.className = 'tile';
      b.type = 'button';
      b.setAttribute('aria-label', 'Søg på ' + s.name);

      const badge = document.createElement('span');
      badge.className = 'badge';
      const img = document.createElement('img');
      img.alt = '';
      img.loading = 'lazy';
      img.src = 'https://www.google.com/s2/favicons?domain=' + s.domain + '&sz=128';
      // If the logo can't load, fall back to a short label instead of a blank chip.
      img.addEventListener('error', () => {
        badge.textContent = s.mono;
        badge.style.font = '700 13px var(--sans)';
        badge.style.color = '#1a1a1a';
      });
      badge.appendChild(img);

      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = s.name;

      const sub = document.createElement('span');
      sub.className = 'sub';
      sub.textContent = s.sub;

      b.append(badge, name, sub);
      b.addEventListener('click', () => go(s.url));
      g.appendChild(b);
    }

    groupsEl.appendChild(g);
  }

  function go(tpl){
    const term = input.value.trim();
    const url = tpl.replace('%s', encodeURIComponent(term));
    // Top-level navigation lets Android hand the https link to the native app (App Links).
    window.location.href = url;
  }

  clearBtn.addEventListener('click', () => { input.value=''; input.focus(); });

  // Enter in the field = search the first service (Google).
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') go(GROUPS[0][0].url);
  });

  // Select all text on focus so a quick edit replaces the whole term.
  input.addEventListener('focus', () => input.select());
</script>
</body>
</html>
