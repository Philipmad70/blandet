<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12131a">
<title>Søg videre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12131a;
    --panel:#1b1d28;
    --panel-edge:#2b2e3d;
    --tile:#20222f;
    --tile-edge:#31344a;
    --tile-hover:#282b3c;
    --ink:#f4f5fb;
    --muted:#9aa0b8;
    --focus:#8ab4ff;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:'Space Grotesk',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(120% 90% at 50% -10%, #1a1c28 0%, var(--bg) 60%);
    color:var(--ink);
    font-family:var(--sans);
    min-height:100dvh;
    padding:
      calc(env(safe-area-inset-top) + 18px)
      calc(env(safe-area-inset-right) + 16px)
      calc(env(safe-area-inset-bottom) + 28px)
      calc(env(safe-area-inset-left) + 16px);
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:560px;margin:0 auto}

  /* Header / query echo — the reason the page exists */
  .eyebrow{
    font-size:12px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);font-weight:600;margin:2px 2px 10px;
  }
  .query{
    display:flex;align-items:center;gap:10px;
    background:var(--panel);
    border:1px solid var(--panel-edge);
    border-radius:16px;
    padding:14px 14px;
    box-shadow:0 8px 30px rgba(0,0,0,.35);
  }
  .query .caret{
    font-family:var(--mono);color:var(--focus);font-size:18px;
    line-height:1;flex:0 0 auto;user-select:none;
  }
  #q{
    flex:1 1 auto;min-width:0;
    background:transparent;border:0;outline:0;
    color:var(--ink);
    font-family:var(--mono);font-size:18px;font-weight:500;
    padding:2px 0;
  }
  #q::placeholder{color:#5b6180}
  .clear{
    flex:0 0 auto;
    width:30px;height:30px;border-radius:9px;
    border:1px solid var(--tile-edge);
    background:var(--tile);color:var(--muted);
    font-size:16px;line-height:1;cursor:pointer;
    display:grid;place-items:center;
  }
  .clear:active{background:var(--tile-hover)}

  .hint{
    color:var(--muted);font-size:12.5px;margin:12px 4px 18px;line-height:1.5;
  }

  /* Grid of services */
  .grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }
  @media(min-width:460px){ .grid{grid-template-columns:repeat(3,1fr)} }

  .tile{
    display:flex;flex-direction:column;gap:10px;
    align-items:flex-start;text-align:left;
    background:var(--tile);
    border:1px solid var(--tile-edge);
    border-radius:16px;
    padding:14px 13px 13px;
    min-height:96px;
    color:var(--ink);
    cursor:pointer;
    transition:transform .08s ease, background .12s ease, border-color .12s ease;
  }
  .tile:hover{background:var(--tile-hover)}
  .tile:active{transform:scale(.97)}
  .tile:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

  /* Monogram badge — carries identity by letter + shape, not colour alone */
  .badge{
    width:36px;height:36px;border-radius:10px;
    display:grid;place-items:center;
    font-weight:700;font-size:15px;line-height:1;
    color:#fff;
    border:1px solid rgba(255,255,255,.14);
  }
  .name{font-weight:600;font-size:15px;letter-spacing:.01em}
  .sub{font-size:11.5px;color:var(--muted);margin-top:-4px}

  .foot{
    margin-top:22px;color:var(--muted);font-size:11.5px;
    line-height:1.5;text-align:center;
  }

  @media(prefers-reduced-motion:reduce){
    .tile{transition:none}
    .tile:active{transform:none}
  }
</style>
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">Søg videre</p>

    <div class="query">
      <span class="caret" aria-hidden="true">&gt;</span>
      <input id="q" type="text" placeholder="skriv eller markér tekst…"
             autocomplete="off" autocapitalize="none" spellcheck="false"
             enterkeyhint="search" aria-label="Søgetekst">
      <button class="clear" id="clear" type="button" aria-label="Ryd tekst">✕</button>
    </div>

    <p class="hint">Vælg en tjeneste — den åbner søgningen med teksten ovenfor.
    Retter du teksten, søger knapperne på det nye.</p>

    <div class="grid" id="grid"></div>

    <p class="foot">Tjenester med app åbner i appen, hvis “Åbn understøttede links” er slået til.</p>
  </main>

<script>
  // Each service: monogram, accent colour (accent only — the name + letter carry identity),
  // and a URL template where %s is replaced by the (URL-encoded) search text.
  const SERVICES = [
    { name:"Google",        sub:"web",        mono:"G",   color:"#4285F4", url:"https://www.google.com/search?q=%s" },
    { name:"Google Billeder",sub:"billeder",  mono:"▦",   color:"#0F9D58", url:"https://www.google.com/search?tbm=isch&q=%s" },
    { name:"YouTube",       sub:"video",       mono:"►",   color:"#FF0000", url:"https://www.youtube.com/results?search_query=%s" },
    { name:"IMDb",          sub:"film & tv",   mono:"★",   color:"#C9A227", url:"https://www.imdb.com/find/?q=%s" },
    { name:"DR TV",         sub:"drtv",        mono:"DR",  color:"#6C4BD8", url:"https://www.dr.dk/drtv/soeg?q=%s" },
    { name:"Reddit",        sub:"tråde",       mono:"r/",  color:"#FF4500", url:"https://www.reddit.com/search/?q=%s" },
    { name:"Netflix",       sub:"stream",      mono:"N",   color:"#E50914", url:"https://www.netflix.com/search?q=%s" },
    { name:"HBO Max",       sub:"stream",      mono:"HBO", color:"#7C5CFF", url:"https://www.hbomax.com/search?q=%s" },
    { name:"Disney+",       sub:"stream",      mono:"D+",  color:"#1F80E0", url:"https://www.disneyplus.com/search?q=%s" },
    { name:"Google Maps",   sub:"kort",        mono:"M",   color:"#2E9E5B", url:"https://www.google.com/maps/search/?api=1&query=%s" },
    { name:"Spotify",       sub:"musik",       mono:"S",   color:"#1DB954", url:"https://open.spotify.com/search/%s" },
    { name:"Wikipedia",     sub:"leksikon",    mono:"W",   color:"#6E6E73", url:"https://da.wikipedia.org/w/index.php?search=%s" },
    { name:"Instagram",     sub:"foto & reels",mono:"IG",  color:"#E1306C", url:"https://www.instagram.com/explore/search/keyword/?q=%s" },
    { name:"Facebook",      sub:"socialt",     mono:"f",   color:"#1877F2", url:"https://www.facebook.com/search/top/?q=%s" },
  ];

  const input = document.getElementById('q');
  const grid  = document.getElementById('grid');
  const clearBtn = document.getElementById('clear');

  // Prefill from ?q= (this is where the text-selection app drops the selected text).
  const initial = new URLSearchParams(location.search).get('q') || '';
  input.value = initial;

  // Build tiles
  for (const s of SERVICES){
    const b = document.createElement('button');
    b.className = 'tile';
    b.type = 'button';
    b.setAttribute('aria-label', 'Søg på ' + s.name);
    b.innerHTML =
      '<span class="badge" style="background:'+s.color+'">'+s.mono+'</span>' +
      '<span class="name">'+s.name+'</span>' +
      '<span class="sub">'+s.sub+'</span>';
    b.addEventListener('click', () => go(s.url));
    grid.appendChild(b);
  }

  function go(tpl){
    const term = input.value.trim();
    const url = tpl.replace('%s', encodeURIComponent(term));
    // Top-level navigation lets Android hand the https link to the native app (App Links).
    window.location.href = url;
  }

  clearBtn.addEventListener('click', () => { input.value=''; input.focus(); });

  // Enter in the field = search the first service (Google).
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') go(SERVICES[0].url);
  });

  // Select all text on focus so a quick edit replaces the whole term.
  input.addEventListener('focus', () => input.select());
</script>
</body>
</html>
