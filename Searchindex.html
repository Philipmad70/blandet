<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Søg videre</title>
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --bg:#ffffff; --chip:#f3f3f5; --chip-press:#e7e7ec;
    --ink:#1c1c1e; --muted:#8a8a90; --field:#f1f1f3;
    --accent:#007aff; --line:#ececef;
    --sans:-apple-system,system-ui,"SF Pro Text",Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--sans);
    min-height:100dvh;
    padding:
      calc(env(safe-area-inset-top) + 24px)
      calc(env(safe-area-inset-right) + 18px)
      calc(env(safe-area-inset-bottom) + 34px)
      calc(env(safe-area-inset-left) + 18px);
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:540px;margin:0 auto}
  [hidden]{display:none !important}

  /* ===== Handlingsark (det delte) ===== */
  .dim{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:20}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;margin:0 auto;max-width:560px;
    background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.16);
    max-height:88dvh;display:flex;flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom);transition:transform .22s ease}
  .sheet.full{height:94dvh;max-height:94dvh}
  .sheet.dragging{transition:none}
  .grab{flex:0 0 auto;padding:10px 0 8px;touch-action:none;cursor:grab}
  .grab span{display:block;width:40px;height:4px;border-radius:2px;background:#d4d4d8;margin:0 auto}
  .sheet .x{position:absolute;right:10px;top:6px;border:0;background:transparent;font-size:16px;color:var(--muted);padding:8px;cursor:pointer}
  .sheet-body{overflow:auto;overscroll-behavior:contain;padding:2px 16px 22px}
  .sheet h3{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:18px 2px 10px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .card{display:flex;gap:10px;align-items:center;background:#f6f6f8;border-radius:14px;padding:10px}
  .card .fav{flex:0 0 auto;width:46px;height:46px;border-radius:11px;background:#e9e9ee;padding:9px;object-fit:contain;display:grid;place-items:center;font-size:20px}
  .card .ct{flex:1;min-width:0}
  .card input{display:block;width:100%;border:0;background:transparent;outline:0;padding:2px 0;font:600 14.5px var(--sans);color:var(--ink)}
  .card input.u{font:400 11.5px var(--sans);color:var(--muted)}
  .card textarea{width:100%;border:0;background:transparent;outline:0;resize:none;font:14.5px/1.45 var(--sans);color:var(--ink);min-height:68px;max-height:30dvh}
  .card.textcard{align-items:stretch}

  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px}
  .act,.qt{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;cursor:pointer;
    font:11.5px/1.2 var(--sans);color:#55555c;text-align:center}
  .act i,.qt i{width:54px;height:54px;border-radius:16px;background:var(--chip);display:grid;place-items:center;
    font-style:normal;font-size:21px;color:var(--ink);transition:background .15s ease,transform .08s ease}
  .act i img,.qt i img{width:26px;height:26px;object-fit:contain}
  .act:active i,.qt:active i{transform:scale(.93);background:var(--chip-press)}
  .act.flash i{background:#1a7f37;color:#fff}
  .act[disabled]{opacity:.5}
  #copied{font-size:12.5px;margin:12px 2px 0;min-height:16px}

  .reopen{display:flex;align-items:center;gap:8px;width:100%;border:0;background:#f6f6f8;border-radius:14px;padding:10px 12px;margin-bottom:16px;
    font:500 13px var(--sans);color:var(--ink);cursor:pointer;text-align:left}
  .reopen span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .reopen b{color:var(--muted);font-weight:500}

  /* Delte filer */
  .thumbs{display:flex;flex-wrap:wrap;gap:8px}
  .thumb{width:88px;height:88px;border-radius:12px;background:#e9e9ee;overflow:hidden;display:grid;place-items:center;font-size:11px;color:var(--muted);text-align:center;padding:4px;word-break:break-all}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}

  /* Hentet tekst (læsevisning) */
  .rtop{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .back{border:0;background:#ececf0;border-radius:9px;padding:7px 10px;font:500 12.5px var(--sans);color:var(--ink);cursor:pointer}
  .kind{display:inline-block;font-size:11.5px;font-weight:600;border:1px solid var(--ink);border-radius:999px;padding:1px 9px}
  .rbtns{display:flex;flex-wrap:wrap;gap:7px}
  .cbtn{display:inline-flex;align-items:center;gap:6px;font:600 13px var(--sans);border:0;border-radius:10px;padding:9px 12px;background:#e9e9ee;color:var(--ink);cursor:pointer}
  .cbtn.dark{background:var(--ink);color:#fff}
  .cbtn.flash{background:#1a7f37;color:#fff}
  #reader article{font-size:15.5px;line-height:1.6;margin-top:12px}
  #reader article h1{font-size:21px;line-height:1.25;margin:4px 0 10px}
  #reader article h2{font-size:17px;margin:20px 0 6px}
  #reader article h3{font-size:15px;margin:14px 0 4px}
  #reader article img{max-width:100%;height:auto;border-radius:10px;display:block;margin:10px 0}
  #reader article .src{font-size:12px;word-break:break-all}
  #reader article .meta{color:var(--muted);font-size:13px}
  #reader article blockquote{margin:8px 0;padding-left:12px;border-left:3px solid var(--ink)}
  #reader article ul,#reader article ol{padding-left:20px}
  #reader article li{margin-bottom:4px}

  /* Search bar */
  .bar{display:flex;align-items:center;gap:9px;background:var(--field);border-radius:14px;padding:12px 14px;margin-bottom:26px}
  .bar svg{flex:0 0 auto}
  #q{flex:1 1 auto;min-width:0;border:0;background:transparent;outline:0;font-size:16px;color:var(--ink);font-family:inherit}
  #q::placeholder{color:#a2a2a8}
  .clear{flex:0 0 auto;border:0;background:transparent;color:var(--muted);font-size:15px;cursor:pointer;padding:2px 4px;line-height:1}

  /* Grouped icon grids */
  .group + .group{margin-top:30px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:22px 12px}
  .tile{display:flex;flex-direction:column;align-items:center;gap:8px;background:transparent;border:0;cursor:pointer;padding:0;font-family:inherit}
  .chip{width:66px;height:66px;border-radius:19px;background:var(--chip);display:grid;place-items:center;transition:background .12s ease,transform .08s ease}
  .chip img{width:32px;height:32px;object-fit:contain;display:block}
  .tile:hover .chip{background:#eeeef2}
  .tile:active .chip{background:var(--chip-press);transform:scale(.93)}
  .tile:focus-visible{outline:none}
  .tile:focus-visible .chip{outline:2px solid var(--accent);outline-offset:2px}
  .name{font-size:12px;color:var(--muted);text-align:center;line-height:1.15;max-width:84px}

  @media(prefers-reduced-motion:reduce){.chip,.act i,.qt i,.sheet{transition:none}.tile:active .chip,.act:active i,.qt:active i{transform:none}}
</style>
</head>
<body>
  <main class="wrap">

    <!-- Lille knap til at åbne arket igen, når man har lukket det -->
    <button class="reopen" id="reopen" type="button" hidden>↑ <span id="reopen-t"></span><b>Vis</b></button>

    <div class="bar">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8a8a90" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
      <input id="q" type="text" placeholder="søg…"
             autocomplete="off" autocapitalize="none" spellcheck="false"
             enterkeyhint="search" aria-label="Søgetekst">
      <button class="clear" id="clear" type="button" aria-label="Ryd">✕</button>
    </div>

    <div id="groups"></div>
  </main>

  <!-- ============ HANDLINGSARK (vises når noget er delt til appen) ============ -->
  <div class="dim" id="dim" hidden></div>
  <section class="sheet" id="share" role="dialog" aria-label="Det delte" hidden>
    <div class="grab" id="grab"><span></span></div>
    <button class="x" id="sheet-close" type="button" aria-label="Luk">✕</button>
    <div class="sheet-body" id="sheet-body">

      <div id="main-view">
        <!-- Kortet øverst: link, tekst eller filer -->
        <div class="card" id="card-link">
          <img class="fav" id="fav" alt="">
          <div class="ct">
            <input id="s-title" type="text" autocomplete="off" spellcheck="false" placeholder="skriv en titel" aria-label="Titel">
            <input id="s-url" class="u" type="text" autocomplete="off" spellcheck="false" aria-label="Link">
          </div>
        </div>
        <div class="thumbs" id="thumbs" hidden></div>
        <div class="card textcard" id="card-text" hidden>
          <textarea id="s-text" rows="3" spellcheck="false" aria-label="Tekst"></textarea>
        </div>

        <h3 id="act-h">Gør noget med linket</h3>
        <div class="grid4" id="acts">
          <button class="act" id="scrape"       data-for="link"  type="button"><i>📄</i>Hent tekst</button>
          <button class="act" id="to-mac"       data-for="link text files" type="button"><i>💻</i>Til Mac</button>
          <button class="act" data-copy="both"  data-for="link"  type="button"><i>📋</i>Kopiér</button>
          <button class="act" id="copy-text"    data-for="text"  type="button"><i>📋</i>Kopiér</button>
          <button class="act" id="share-link"   data-for="link"  type="button"><i>↗</i>Del</button>
          <button class="act" id="share-text"   data-for="text"  type="button"><i>↗</i>Del</button>
          <button class="act" id="share-on"     data-for="files" type="button"><i>↗</i>Del</button>
          <button class="act" id="gemini-note"  data-for="link"  type="button"><i>🗒</i>Noter &amp; Links</button>
          <button class="act" id="gemini-share" data-for="link"  type="button"><i><img src="https://www.google.com/s2/favicons?domain=gemini.google.com&amp;sz=128" alt="" onerror="this.replaceWith('✦')"></i>Klip</button>
          <button class="act" data-copy="md"    data-for="link"  type="button"><i>[ ]</i>Markdown</button>
          <button class="act" data-copy="html"  data-for="link"  type="button"><i>&lt;/&gt;</i>HTML</button>
        </div>
        <p id="copied" role="status" aria-live="polite"></p>

        <div id="sheet-search">
          <h3 id="search-h">Søg</h3>
          <div class="grid4" id="quick"></div>
        </div>
      </div>

      <!-- Hentet tekst -->
      <div id="reader" hidden>
        <div class="rtop">
          <button class="back" id="r-back" type="button">← Tilbage</button>
          <span class="kind" id="r-kind"></span>
        </div>
        <div class="rbtns">
          <button class="cbtn dark" id="r-share" type="button">↗ Del</button>
          <button class="cbtn" id="r-copy" type="button">📋 Kopiér</button>
          <button class="cbtn" id="r-toggle" type="button" hidden></button>
        </div>
        <article id="r-article"></article>
      </div>

    </div>
  </section>

<script src="config.js"></script>
<script>
  // ==================== INDSTILLINGER ====================
  // Grupper (øverst → nederst): søgning/opslag · streaming · socialt · AI
  const GROUPS = [
    [
      { name:"Google",          domain:"google.com",        mono:"G",    url:"https://www.google.com/search?q=%s" },
      { name:"Google Billeder", domain:"images.google.com", mono:"IMG",  url:"https://www.google.com/search?tbm=isch&q=%s" },
      { name:"Google Maps",     domain:"maps.google.com",   mono:"M",    url:"https://www.google.com/maps/search/?api=1&query=%s" },
      { name:"Wikipedia",       domain:"en.wikipedia.org",  mono:"W",    url:"https://en.wikipedia.org/w/index.php?search=%s" },
      { name:"IMDb",            domain:"imdb.com",          mono:"IMDb", url:"https://www.imdb.com/find/?q=%s" },
      { name:"Bibliotek KK",    domain:"bibliotek.kk.dk",   mono:"KK",   url:"https://bibliotek.kk.dk/search?q=%s" },
    ],
    [
      { name:"YouTube",         domain:"youtube.com",       mono:"YT",   url:"https://www.youtube.com/results?search_query=%s" },
      { name:"DR TV",           domain:"dr.dk",             mono:"DR",   url:"https://www.google.com/search?q=%s%20site:dr.dk/drtv" },
      { name:"Netflix",         domain:"netflix.com",       mono:"N",    url:"https://www.google.com/search?q=%s%20site:netflix.com" },
      { name:"HBO Max",         domain:"hbomax.com",        mono:"HBO",  url:"https://www.google.com/search?q=%s%20site:hbomax.com" },
      { name:"Disney+",         domain:"disneyplus.com",    mono:"D+",   url:"https://www.google.com/search?q=%s%20site:disneyplus.com" },
      { name:"Spotify",         domain:"spotify.com",       mono:"S",    url:"https://open.spotify.com/search/%s" },
      { name:"AllMusic",        domain:"allmusic.com",      mono:"AM",   url:"https://www.allmusic.com/search/all/%s" },
      { name:"Album of the Year", domain:"albumoftheyear.org", mono:"AOTY", url:"https://www.albumoftheyear.org/search/?q=%s" },
    ],
    [
      { name:"Reddit",          domain:"reddit.com",        mono:"r/",   url:"https://www.reddit.com/search/?q=%s" },
      { name:"Instagram",       domain:"instagram.com",     mono:"IG",   url:"https://www.instagram.com/explore/search/keyword/?q=%s" },
      { name:"Facebook",        domain:"facebook.com",      mono:"f",    url:"https://www.facebook.com/search/top/?q=%s" },
    ],
    [
      { name:"ChatGPT",         domain:"chatgpt.com",       mono:"GPT",  url:"https://chatgpt.com/?q=%s" },
      { name:"Claude",          domain:"claude.ai",         mono:"C",    url:"https://claude.ai/new?q=%s" },
    ],
    [
      { name:"Apple Podcast",   domain:"podcasts.apple.com", mono:"AP",  url:"https://www.google.com/search?q=%s%20site:podcasts.apple.com/dk" },
      { name:"Ordnet",          domain:"ordnet.dk",         mono:"ORD",  url:"https://www.google.com/search?q=%s%20ordnet" },
    ],
  ];

  // Titel-/side-Worker (bagt ind; config.js kan overskrive)
  const TITLE_WORKER  = (window.TITLE_WORKER || "https://henttitel.philipmad70.workers.dev/").trim();
  // Noter & Links (Apps Script) – sættes i config.js, så den ikke forsvinder ved ny upload
  const KLIP_ENDPOINT = (window.KLIP_ENDPOINT || "").trim();
  const KLIP_TOKEN    = "klip-jj283uw8i64sj1wxur3z";
  // ntfy-emnet, Snild lytter på ("Modtag fra telefonen"). Sættes i config.js.
  const MAC_TOPIC = (window.MAC_TOPIC || "").trim();
  // =======================================================

  /* ==== Udtræk: opskrift eller artikel fra et HTML-dokument ==== */
  var READABILITY_URL='https://cdn.jsdelivr.net/npm/@mozilla/readability@0.5.0/Readability.js';

  function clean(s){
    var t=document.createElement('textarea');
    t.innerHTML=String(s==null?'':s).replace(/<[^>]+>/g,' ');
    return t.value.replace(/\s+/g,' ').trim();
  }
  function abs(u,base){try{return new URL(u,base).href;}catch(e){return '';}}
  function metaContent(doc,prop){
    var m=doc.querySelector('meta[property="'+prop+'"],meta[name="'+prop+'"]');
    return m?clean(m.getAttribute('content')):'';
  }

  /* ---- Opskrift ---- */
  function isRecipe(o){var t=o&&o['@type'];return t==='Recipe'||(Array.isArray(t)&&t.indexOf('Recipe')>-1);}
  function findRecipe(o){
    if(!o||typeof o!=='object')return null;
    if(Array.isArray(o)){for(var i=0;i<o.length;i++){var r=findRecipe(o[i]);if(r)return r;}return null;}
    if(isRecipe(o))return o;
    if(o['@graph'])return findRecipe(o['@graph']);
    if(o.mainEntity)return findRecipe(o.mainEntity);
    return null;
  }
  function dur(d){
    var m=String(d||'').match(/^P(?:(\d+)D)?(?:T(?:(\d+)H)?(?:(\d+)M)?)?/);
    if(!m)return '';
    var h=(+m[1]||0)*24+(+m[2]||0),mi=+m[3]||0,p=[];
    if(h)p.push(h+' t');if(mi)p.push(mi+' min');
    return p.join(' ');
  }
  function ldSteps(x,out){
    if(!x)return;
    if(typeof x==='string'){x.split(/\n+/).forEach(function(s){s=clean(s);if(s)out.push({t:s});});return;}
    if(Array.isArray(x)){x.forEach(function(i){ldSteps(i,out);});return;}
    if(x['@type']==='HowToSection'||x.itemListElement){
      if(x.name)out.push({h:clean(x.name)});
      ldSteps(x.itemListElement,out);return;
    }
    var t=clean(x.text||x.name);if(t)out.push({t:t});
  }
  function pickImg(im){
    if(!im)return '';
    if(typeof im==='string')return im;
    if(Array.isArray(im)){
      var best='',bw=-1;
      im.forEach(function(i){
        var u=typeof i==='string'?i:(i&&(i.url||i.contentUrl));var w=(i&&+i.width)||0;
        if(u&&w>bw){best=u;bw=w;}
      });
      return best;
    }
    return im.url||im.contentUrl||'';
  }
  function hLevel(e){var m=/^H([1-6])$/.exec(e.tagName);return m?+m[1]:0;}
  function grabSection(doc,re,allowP){
    var hs=doc.querySelectorAll('h1,h2,h3,h4,h5,h6,p>strong:only-child,p>b:only-child'),head=null;
    for(var i=0;i<hs.length;i++){if(re.test(clean(hs[i].textContent))){head=hs[i];break;}}
    if(!head)return [];
    var start=hLevel(head)?head:head.parentElement;
    var L=hLevel(start)||6,out=[],n=start.nextElementSibling;
    while(n){
      var l=hLevel(n);
      if(l&&l<=L)break;
      if(l){out.push({h:clean(n.textContent).replace(/:\s*$/,'')});}
      else if(/^(UL|OL)$/.test(n.tagName)){
        n.querySelectorAll(':scope>li').forEach(function(li){var t=clean(li.textContent);if(t)out.push({t:t});});
      }
      else if(n.querySelector('h1,h2,h3,h4,h5,h6')){break;}
      else if(n.querySelector('ul,ol')&&!n.querySelector('a[href*="amazon"],img')){
        n.querySelectorAll('li').forEach(function(li){var t=clean(li.textContent);if(t)out.push({t:t});});
      }
      else if(allowP&&n.tagName==='P'){var t=clean(n.textContent);if(t)out.push({t:t});}
      n=n.nextElementSibling;
    }
    while(out.length&&out[out.length-1].h)out.pop();
    return out;
  }
  function findFact(doc,re){
    var els=doc.querySelectorAll('li,p');
    for(var i=0;i<els.length;i++){var t=clean(els[i].textContent),m=re.exec(t);if(m&&t.length<120)return clean(m[1]);}
    return '';
  }
  function itemsToBlocks(items,ordered){
    var out=[],list=null;
    items.forEach(function(s){
      if(s.h){list=null;out.push({type:'h3',text:s.h});}
      else{if(!list){list={type:ordered?'ol':'ul',items:[]};out.push(list);}list.items.push(s.t);}
    });
    return out;
  }
  function getRecipe(doc,url){
    var rec=null;
    doc.querySelectorAll('script[type="application/ld+json"]').forEach(function(s){
      if(rec)return;try{rec=findRecipe(JSON.parse(s.textContent));}catch(e){}
    });
    var name='',y='',time='',ing=[],st=[],img='';
    if(rec){
      name=clean(rec.name);
      y=rec.recipeYield;if(Array.isArray(y))y=y[y.length-1];y=clean(y);
      if(/^\d+$/.test(y))y+=' portioner';
      time=dur(rec.totalTime)||dur(rec.cookTime);
      ing=(rec.recipeIngredient||rec.ingredients||[]).map(clean).filter(Boolean).map(function(t){return {t:t};});
      ldSteps(rec.recipeInstructions,st);
      img=pickImg(rec.image);
    }else{
      ing=grabSection(doc,/^(ingredients?|ingredienser|ingredienslister?)\s*:?\s*(\(.*\))?$/i,false);
      st=grabSection(doc,/^(instructions?|directions?|method|preparation|steps|how to make( it)?|fremgangsmåde|sådan gør du)\s*:?$/i,true);
      if(ing.filter(function(x){return x.t;}).length<2)return null;
      var h1=doc.querySelector('h1');name=h1?clean(h1.textContent):'';
      time=findFact(doc,/^total time\s*:?\s*(.+)$/i);
      y=findFact(doc,/^(?:servings|serves|yield|portioner)\s*:?\s*(\d.*)$/i);
    }
    if(!ing.length&&!st.length)return null;
    var meta=[];if(y)meta.push('Portioner: '+y);if(time)meta.push('Tid: '+time);
    var blocks=[];
    if(ing.length){blocks.push({type:'h2',text:'Ingredienser'});blocks=blocks.concat(itemsToBlocks(ing,false));}
    if(st.length){blocks.push({type:'h2',text:'Fremgangsmåde'});blocks=blocks.concat(itemsToBlocks(st,true));}
    return {
      kind:'recipe',
      title:name||metaContent(doc,'og:title')||clean(doc.title),
      img:abs(img||metaContent(doc,'og:image'),url),
      url:url,meta:meta,blocks:blocks
    };
  }

  /* ---- Artikel ---- */
  function loadReadability(){
    if(window.Readability)return Promise.resolve(true);
    return new Promise(function(res){
      var s=document.createElement('script');s.src=READABILITY_URL;
      s.onload=function(){res(!!window.Readability);};s.onerror=function(){res(false);};
      document.head.appendChild(s);
    });
  }
  var BLOCKY='p,div,h1,h2,h3,h4,h5,h6,ul,ol,blockquote,figure,section,article,table,pre,img';
  function walk(node,out,base,seen){
    for(var i=0;i<node.children.length;i++){
      var el=node.children[i],tag=el.tagName,t;
      if(/^(SCRIPT|STYLE|NOSCRIPT|IFRAME|FORM|BUTTON|SVG|NAV|ASIDE|FOOTER|HEADER|SELECT|INPUT)$/.test(tag))continue;
      if(/^H[1-6]$/.test(tag)){t=clean(el.textContent);if(t)out.push({type:tag<='H2'?'h2':'h3',text:t});}
      else if(tag==='P'||tag==='PRE'){
        t=clean(el.textContent);if(t)out.push({type:'p',text:t});
        el.querySelectorAll('img').forEach(function(im){pushImg(im,out,base,seen);});
      }
      else if(tag==='UL'||tag==='OL'){
        var items=[];
        for(var j=0;j<el.children.length;j++){if(el.children[j].tagName==='LI'){t=clean(el.children[j].textContent);if(t)items.push(t);}}
        if(items.length)out.push({type:tag.toLowerCase(),items:items});
      }
      else if(tag==='BLOCKQUOTE'){t=clean(el.textContent);if(t)out.push({type:'quote',text:t});}
      else if(tag==='IMG'){pushImg(el,out,base,seen);}
      else if(el.querySelector(BLOCKY)){walk(el,out,base,seen);}
      else{t=clean(el.textContent);if(t)out.push({type:'p',text:t});}
    }
  }
  function pushImg(im,out,base,seen){
    var src=im.getAttribute('data-src')||im.getAttribute('data-lazy-src')||im.getAttribute('src')||'';
    if(!src||/^data:/.test(src)||/\.svg(\?|$)/i.test(src))return;
    var w=+im.getAttribute('width');if(w&&w<120)return;
    src=abs(src,base);var key=imgKey(src);if(!src||seen[key])return;seen[key]=1;
    out.push({type:'img',src:src});
  }
  /* Samme billede i flere størrelser (fx foto-780x470.jpg og foto-300x251.jpg) tæller som ét */
  function imgKey(u){return String(u).split('?')[0].replace(/-\d+x\d+(?=\.\w+$)/,'');}
  function fallbackRoot(doc){
    var d=doc.cloneNode(true);
    d.querySelectorAll('script,style,noscript,iframe,nav,aside,footer,header,form,[class*="share"],[class*="related"],[class*="comment"],[class*="newsletter"],[class*="ad-"],[id*="comment"]').forEach(function(e){e.remove();});
    var c=d.querySelector('[itemprop="articleBody"],article,.entry-content,.post-content,.article-body,.article__body,main');
    if(c)return c;
    var best=d.body,score=0;
    d.querySelectorAll('div,section').forEach(function(el){
      var s=0;for(var i=0;i<el.children.length;i++){if(el.children[i].tagName==='P')s+=el.children[i].textContent.length;}
      if(s>score){score=s;best=el;}
    });
    return best;
  }
  function getArticle(doc,url){
    return loadReadability().then(function(ok){
      var title=metaContent(doc,'og:title')||clean(doc.title),byline='',root=null;
      if(ok){

          var a=new Readability(doc.cloneNode(true)).parse();

        }catch(e){}
      }
      if(!root)root=fallbackRoot(doc);
      var blocks=[],seen={};
      walk(root,blocks,url,seen);
      /* Fjern gentagelse af titlen øverst */
      if(blocks.length&&blocks[0].text&&blocks[0].text===title)blocks.shift();
      var img=abs(metaContent(doc,'og:image'),url);
      if(img&&seen[imgKey(img)])img='';
      return {kind:'article',title:title,img:img,url:url,meta:byline?[byline]:[],blocks:blocks};
    });
  }

  function blocksHTML(r, withTitle){
    let h = withTitle ? '<h1>' + esc(r.title) + '</h1>' : '';

    h += '<p class="src"><a href="' + esc(r.url) + '">' + esc(r.url) + '</a></p>';
    if (r.meta.length) h += '<p class="meta">' + esc(r.meta.join(' · ')) + '</p>';

      if (b.type === 'h2' || b.type === 'h3') h += '<' + b.type + '>' + esc(b.text) + '</' + b.type + '>';

      else if (b.type === 'quote') h += '<blockquote>' + esc(b.text) + '</blockquote>';

  function blocksText(r){

  });

  // ==================== SØGNING (uændret) ====================
  const q = params.get('q');
  if (q !== null) input.value = q;

  for (const group of GROUPS){
    const g = document.createElement('div'); g.className='group';
    const grid = document.createElement('div'); grid.className='grid';
    for (const s of group){
      const b = document.createElement('button');
      b.className='tile'; b.type='button';
      b.setAttribute('aria-label','Søg på ' + s.name);
      const chip = document.createElement('span'); chip.className='chip';
      const img = document.createElement('img'); img.alt=''; img.loading='lazy';
      img.src = 'https://www.google.com/s2/favicons?domain=' + s.domain + '&sz=128';
      img.addEventListener('error', () => { chip.textContent = s.mono; chip.style.font='600 15px var(--sans)'; chip.style.color='#6b6b72'; });
      chip.appendChild(img);
      const name = document.createElement('span'); name.className='name'; name.textContent=s.name;
      b.append(chip, name);
      b.addEventListener('click', () => go(s.url));
      grid.appendChild(b);
    }
    g.appendChild(grid);
    groupsEl.appendChild(g);
  }

  function go(tpl){
    const term = input.value.trim();
    let enc = encodeURIComponent(term);
    if (tpl.includes('allmusic.com')) enc = enc.replace(/%20/g, '+'); // AllMusic vil have + mellem ord
    openExternally(tpl.replace('%s', enc));
  }

  // Åbn i den eksterne browser (fuld Chrome) i stedet for en intern fane.
  function openExternally(url){
    let href = url;
    if (isAndroid && /^https?:\/\//i.test(url)){
      const scheme = url.split('://')[0];
      const rest = url.slice(url.indexOf('://') + 3);
      href = 'intent://' + rest +
        '#Intent;scheme=' + scheme +
        ';action=android.intent.action.VIEW' +
        ';S.browser_fallback_url=' + encodeURIComponent(url) +
        ';end';
    }
    const a = document.createElement('a');
    a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer';
    document.body.appendChild(a); a.click(); a.remove();
  }
  clearBtn.addEventListener('click', () => { input.value=''; input.focus(); });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') go(GROUPS[0][0].url); });
  input.addEventListener('focus', () => input.select());

  // Ryd adressen, så en genindlæsning ikke viser det delte igen
  if (hasShare) history.replaceState(null, '', location.pathname);

  if ('serviceWorker' in navigator){
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }
</script>
</body>
</html>
