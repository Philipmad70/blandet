<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Søg videre</title>
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --bg:#ffffff; --chip:#f3f3f5; --chip-press:#e7e7ec;
    --ink:#1c1c1e; --muted:#8a8a90; --field:#f1f1f3;
    --accent:#007aff; --line:#ececef;
    --sans:-apple-system,system-ui,"SF Pro Text",Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--sans);
    min-height:100dvh;
    padding:
      calc(env(safe-area-inset-top) + 24px)
      calc(env(safe-area-inset-right) + 18px)
      calc(env(safe-area-inset-bottom) + 34px)
      calc(env(safe-area-inset-left) + 18px);
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:540px;margin:0 auto}

  /* Shared-link panel (only when a link was shared to the page) */
  #share{background:#f7f7f9;border-radius:16px;padding:14px 14px 13px;margin-bottom:20px}
  #share h2{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 10px}
  .field{margin-bottom:9px}
  .field label{display:block;font-size:11px;color:var(--muted);margin:0 0 4px}
  .field input{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 10px;font-size:13px;color:var(--ink);font-family:inherit;outline:0}
  .field input:focus{border-color:var(--accent)}
  .copybtns{display:flex;flex-wrap:wrap;gap:7px;margin-top:3px}
  .cbtn{font-family:inherit;font-size:12.5px;font-weight:500;border:0;border-radius:9px;padding:8px 11px;background:#e9e9ee;color:var(--ink);cursor:pointer}
  .cbtn.primary{background:var(--accent);color:#fff}
  .cbtn:active{transform:scale(.97)}
  #copied{font-size:12px;color:#1a7f37;margin:9px 2px 0;min-height:15px}

  /* Search bar */
  .bar{display:flex;align-items:center;gap:9px;background:var(--field);border-radius:14px;padding:12px 14px;margin-bottom:26px}
  .bar svg{flex:0 0 auto}
  #q{flex:1 1 auto;min-width:0;border:0;background:transparent;outline:0;font-size:16px;color:var(--ink);font-family:inherit}
  #q::placeholder{color:#a2a2a8}
  .clear{flex:0 0 auto;border:0;background:transparent;color:var(--muted);font-size:15px;cursor:pointer;padding:2px 4px;line-height:1}

  /* Grouped icon grids, stacked with breathing room between groups */
  .group + .group{margin-top:30px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:22px 12px}
  .tile{display:flex;flex-direction:column;align-items:center;gap:8px;background:transparent;border:0;cursor:pointer;padding:0;font-family:inherit}
  .chip{width:66px;height:66px;border-radius:19px;background:var(--chip);display:grid;place-items:center;transition:background .12s ease,transform .08s ease}
  .chip img{width:32px;height:32px;object-fit:contain;display:block}
  .tile:hover .chip{background:#eeeef2}
  .tile:active .chip{background:var(--chip-press);transform:scale(.93)}
  .tile:focus-visible{outline:none}
  .tile:focus-visible .chip{outline:2px solid var(--accent);outline-offset:2px}
  .name{font-size:12px;color:var(--muted);text-align:center;line-height:1.15;max-width:84px}

  @media(prefers-reduced-motion:reduce){.chip,.cbtn{transition:none}.tile:active .chip,.cbtn:active{transform:none}}
</style>
</head>
<body>
  <main class="wrap">
    <section id="share" hidden>
      <h2>Delt link</h2>
      <div class="field">
        <label for="s-title">Titel</label>
        <input id="s-title" type="text" autocomplete="off" spellcheck="false" placeholder="skriv en titel">
      </div>
      <div class="field">
        <label for="s-url">URL</label>
        <input id="s-url" type="text" autocomplete="off" spellcheck="false">
      </div>
      <div class="copybtns">
        <button class="cbtn primary" data-copy="link" type="button">Kopiér som link</button>
        <button class="cbtn" data-copy="md" type="button">Markdown</button>
        <button class="cbtn" data-copy="url" type="button">URL</button>
        <button class="cbtn" data-copy="title" type="button">Titel</button>
        <button class="cbtn" data-copy="both" type="button">Titel + URL</button>
      </div>
      <p id="copied" role="status" aria-live="polite"></p>
    </section>

    <div class="bar">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8a8a90" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
      <input id="q" type="text" placeholder="søg…"
             autocomplete="off" autocapitalize="none" spellcheck="false"
             enterkeyhint="search" aria-label="Søgetekst">
      <button class="clear" id="clear" type="button" aria-label="Ryd">✕</button>
    </div>

    <div id="groups"></div>
  </main>

<script>
  // Grupper (øverst → nederst): søgning/opslag · streaming · socialt · AI
  const GROUPS = [
    [
      { name:"Google",          domain:"google.com",        mono:"G",    url:"https://www.google.com/search?q=%s" },
      { name:"Google Billeder", domain:"images.google.com", mono:"IMG",  url:"https://www.google.com/search?tbm=isch&q=%s" },
      { name:"Google Maps",     domain:"maps.google.com",   mono:"M",    url:"https://www.google.com/maps/search/?api=1&query=%s" },
      { name:"Wikipedia",       domain:"da.wikipedia.org",  mono:"W",    url:"https://da.wikipedia.org/w/index.php?search=%s" },
      { name:"IMDb",            domain:"imdb.com",          mono:"IMDb", url:"https://www.imdb.com/find/?q=%s" },
    ],
    [
      { name:"YouTube",         domain:"youtube.com",       mono:"YT",   url:"https://www.youtube.com/results?search_query=%s" },
      { name:"DR TV",           domain:"dr.dk",             mono:"DR",   url:"https://www.dr.dk/drtv/soeg?q=%s" },
      { name:"Netflix",         domain:"netflix.com",       mono:"N",    url:"https://www.netflix.com/search?q=%s" },
      { name:"HBO Max",         domain:"hbomax.com",        mono:"HBO",  url:"https://www.hbomax.com/search?q=%s" },
      { name:"Disney+",         domain:"disneyplus.com",    mono:"D+",   url:"https://www.disneyplus.com/search?q=%s" },
      { name:"Spotify",         domain:"spotify.com",       mono:"S",    url:"https://open.spotify.com/search/%s" },
    ],
    [
      { name:"Reddit",          domain:"reddit.com",        mono:"r/",   url:"https://www.reddit.com/search/?q=%s" },
      { name:"Instagram",       domain:"instagram.com",     mono:"IG",   url:"https://www.instagram.com/explore/search/keyword/?q=%s" },
      { name:"Facebook",        domain:"facebook.com",      mono:"f",    url:"https://www.facebook.com/search/top/?q=%s" },
    ],
    [
      { name:"ChatGPT",         domain:"chatgpt.com",       mono:"GPT",  url:"https://chatgpt.com/?q=%s" },
      { name:"Claude",          domain:"claude.ai",         mono:"C",    url:"https://claude.ai/new?q=%s" },
    ],
  ];

  const input = document.getElementById('q');
  const groupsEl = document.getElementById('groups');
  const clearBtn = document.getElementById('clear');
  const params = new URLSearchParams(location.search);

  // Din egen Cloudflare Worker, der returnerer {"title":"..."} for en URL.
  // Indsæt din Worker-adresse her, fx: "https://titel.dit-navn.workers.dev"
  const TITLE_WORKER = "";

  // ---- Shared link handling (Web Share Target) --------------------------
  const shareEl = document.getElementById('share');
  const sTitle  = document.getElementById('s-title');
  const sUrl    = document.getElementById('s-url');
  const copied  = document.getElementById('copied');

  let titleLocked = false;
  sTitle.addEventListener('input', () => { titleLocked = true; });

  const rawTitle = params.get('title') || '';
  const rawText  = params.get('text')  || '';
  let   rawUrl   = params.get('url')   || '';
  const hasShare = !!(rawTitle || rawText || rawUrl);

  function prettyFromUrl(u){
    try{
      const url = new URL(u);
      const segs = url.pathname.split('/').filter(Boolean);
      if (!segs.length) return '';
      let slug = decodeURIComponent(segs[segs.length - 1]).replace(/\.(html?|php|aspx)$/i,'');
      if (!/[a-zæøå].*[-_].*[a-zæøå]/i.test(slug)) return '';
      slug = slug.replace(/[-_]+/g,' ').replace(/\s+/g,' ').trim();
      if (slug.length < 3) return '';
      return slug.charAt(0).toUpperCase() + slug.slice(1);
    }catch(e){ return ''; }
  }

  if (hasShare){
    if (!rawUrl){
      const m = rawText.match(/https?:\/\/[^\s]+/);
      if (m) rawUrl = m[0];
    }
    const isUrlLike = (s) => /^\s*https?:\/\/\S+\s*$/i.test(s || '');
    let title = rawTitle.trim();
    if (isUrlLike(title)) title = '';
    if (!title){
      const leftover = rawText.replace(/https?:\/\/[^\s]+/g, '').trim();
      if (leftover) title = leftover;
    }
    if (!title) title = prettyFromUrl(rawUrl);

    sTitle.value = title;
    sUrl.value = rawUrl;
    shareEl.hidden = false;
    if (title) input.value = title;

    if (rawUrl){
      if (!sTitle.value) sTitle.placeholder = 'henter titel…';
      fetchTitleRemote(rawUrl).then(t => {
        sTitle.placeholder = 'skriv en titel';
        if (t && !titleLocked){
          const prev = sTitle.value;
          sTitle.value = t;
          if (!input.value || input.value === prev) input.value = t;
        }
      });
    }
  }

  async function fetchTitleRemote(url){
    const withTimeout = (p, ms) =>
      Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
    if (TITLE_WORKER){
      try{
        const r = await withTimeout(fetch(TITLE_WORKER + '?url=' + encodeURIComponent(url)), 6500);
        if (r.ok){ const j = await r.json(); if (j && j.title) return String(j.title).trim(); }
      }catch(e){}
    }
    try{
      const r = await withTimeout(fetch('https://noembed.com/embed?url=' + encodeURIComponent(url)), 6500);
      if (r.ok){ const j = await r.json(); if (j && j.title) return String(j.title).trim(); }
    }catch(e){}
    return '';
  }

  function currentPieces(){ return { t: sTitle.value.trim(), u: sUrl.value.trim() }; }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function buildCopy(kind){
    const { t, u } = currentPieces();
    if (kind === 'md')    return t ? '[' + t + '](' + u + ')' : '<' + u + '>';
    if (kind === 'url')   return u;
    if (kind === 'title') return t;
    if (kind === 'both')  return (t ? t + '\n' : '') + u;
    return '';
  }
  async function copyText(text){
    try{ await navigator.clipboard.writeText(text); return true; }
    catch(e){
      try{
        const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
        document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');document.body.removeChild(ta);return ok;
      }catch(_){ return false; }
    }
  }
  // Rich copy: puts a clickable HTML link on the clipboard (like Tab Copy),
  // with a plain-text version as fallback for plain fields.
  async function copyRichLink(){
    const { t, u } = currentPieces();
    if (!u) return false;
    const html  = '<a href="' + esc(u) + '">' + esc(t || u) + '</a>';
    const plain = t ? (t + ' — ' + u) : u;
    try{
      const item = new ClipboardItem({
        'text/html':  new Blob([html],  { type:'text/html' }),
        'text/plain': new Blob([plain], { type:'text/plain' }),
      });
      await navigator.clipboard.write([item]);
      return true;
    }catch(e){
      return copyText(plain); // ældre browsere: fald tilbage til ren tekst
    }
  }
  let copiedTimer;
  document.querySelectorAll('.cbtn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const ok = btn.dataset.copy === 'link'
        ? await copyRichLink()
        : await copyText(buildCopy(btn.dataset.copy));
      copied.textContent = ok ? 'Kopieret ✓' : 'Kunne ikke kopiere — markér og kopiér manuelt';
      copied.style.color = ok ? '#1a7f37' : '#b00020';
      clearTimeout(copiedTimer);
      copiedTimer = setTimeout(() => { copied.textContent = ''; }, 2200);
    });
  });

  // ---- Search prefill ---------------------------------------------------
  const q = params.get('q');
  if (q !== null) input.value = q;

  // ---- Build grouped icon grids -----------------------------------------
  for (const group of GROUPS){
    const g = document.createElement('div'); g.className='group';
    const grid = document.createElement('div'); grid.className='grid';
    for (const s of group){
      const b = document.createElement('button');
      b.className='tile'; b.type='button';
      b.setAttribute('aria-label','Søg på ' + s.name);
      const chip = document.createElement('span'); chip.className='chip';
      const img = document.createElement('img'); img.alt=''; img.loading='lazy';
      img.src = 'https://www.google.com/s2/favicons?domain=' + s.domain + '&sz=128';
      img.addEventListener('error', () => { chip.textContent = s.mono; chip.style.font='600 15px var(--sans)'; chip.style.color='#6b6b72'; });
      chip.appendChild(img);
      const name = document.createElement('span'); name.className='name'; name.textContent=s.name;
      b.append(chip, name);
      b.addEventListener('click', () => go(s.url));
      grid.appendChild(b);
    }
    g.appendChild(grid);
    groupsEl.appendChild(g);
  }

  function go(tpl){
    const term = input.value.trim();
    window.location.href = tpl.replace('%s', encodeURIComponent(term));
  }
  clearBtn.addEventListener('click', () => { input.value=''; input.focus(); });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') go(GROUPS[0][0].url); });
  input.addEventListener('focus', () => input.select());

  if ('serviceWorker' in navigator){
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }
</script>
</body>
</html>
